services:
  postgres:
    image: 'postgres:latest'
    environment:
        # add your values in .env.example to put here
        POSTGRES_DB: mydatabase
        POSTGRES_USER: ${DB_USERNAME:?Set DB_USERNAME in .env}
        POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432" # 127.0.0.1 is standard loopback address
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: 'rabbitmq:management'
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:?Set RABBITMQ_USERNAME in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    ports:
      # 5672 for RabbitMQ communication
      - "127.0.0.1:5672:5672"
      # 15672 for the web management interface
      - "127.0.0.1:15672:15672"

  redis:
    image: 'redis:latest'
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  postgres_data: