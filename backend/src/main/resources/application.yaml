server:
  port: 8085
spring:
  application:
    name: backend
  docker:
    compose:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/mydatabase
    username: myuser
    password: secret
  jpa:
    hibernate:
      ddl-auto: update
      show-sql: true
      properties:
        hibernate:
          format_sql: true
  autoconfigure:
    exclude:
      - org.springframework.boot.data.redis.autoconfigure.RedisAutoConfigurationadd .

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-ms: 900000      # 15 min
    refresh-token-expiration-ms: 1296000000 # 15 days