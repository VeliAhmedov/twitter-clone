#main part where it runs all 5 containers together (3 from backend + front and back), not to confused by backend compose
#publish port to 80

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: mydatabase
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d mydatabase"] # checking readniness of db
      interval: 5s                                                         # runs check for every 5 sec
      retries: 10                                                          # after 10 fails of check after retries, it marks as unhealthy
    restart: unless-stopped # tell to restart if container unexpectedly stops, unless explicitly stopped

  redis:
    image: redis:8
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 10
    restart: unless-stopped

  # docker look for dockerfile in backend dir and builds image from it
  backend:
    build: ./backend
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_started }
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mydatabase
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      APP_CORS_ALLOWED_ORIGINS: ${APP_URL:-http://localhost}
      SPRINGDOC_API_DOCS_ENABLED: "false"
      SPRINGDOC_SWAGGER_UI_ENABLED: "false"
      LOGGING_LEVEL_ORG_HIBERNATE_SQL: INFO
    volumes:
      - uploads:/app/uploads
    restart: unless-stopped

  # same as backend, just tells docker to start this after backend (depends on)
  frontend:
    build: ./frontend
    depends_on: [backend]
    ports:
      - "80:80"
    restart: unless-stopped

# postgredata and uploads for backend files to be stored
volumes:
  postgres_data:
  uploads:

#1. User's browser -> opens application at http://localhost

#2. Frontend — Nginx (server for front) -> Port 80, Serves react files and forwards API requests

#3. Backend — Spring Boot -> port 8085 inside the Docker network

#4. PostgreSQL = Persistent data, Redis = Cache and fast data access, RabbitMQ = Message queues